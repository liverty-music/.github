name: Reusable Claude Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # A review of a commit that a newer push superseded is wasted runner time,
    # and the callers had no concurrency group, so every push ran a full review
    # to the end (cloud-provisioning#666). The group lives here so all four
    # callers get it; `github` is the caller's context in a reusable workflow.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Draft pull requests are reviewed once they are marked ready: every caller
    # triggers on `ready_for_review`.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      # A review costs a share of the CLAUDE_CODE_OAUTH_TOKEN account's weekly
      # limit, and Renovate used most of it: 221 of the 395 reviews from
      # 2026-11-01 to 11-07 were its pull requests, every rebase a full review,
      # and on 11-07 the limit ran out and every repository's review failed
      # ("You've hit your weekly limit"). A minor, patch, digest, pin or lock
      # update is gated by CI and mostly automerges; a major changes an API and
      # is merged by a person, so only majors are reviewed.
      #
      # A major is recognised by Renovate's default title: `commitMessageExtra`
      # writes the bare major (`to v7`) for a major and the full version
      # (`to v7.0.2`) otherwise, and a group of majors ends in `(major)`. A
      # `renovate/major-*` branch counts too. Checked against the 231 Renovate
      # pull requests in the organization up to 2026-11-08: all 43 majors match
      # and nothing else does. A label would be sturdier, but Renovate adds it
      # after opening the pull request, so the `opened` event carries none.
      - name: Decide whether to review
        id: scope
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          review=true
          if [ "$AUTHOR" = "renovate[bot]" ]; then
            review=false
            if [[ "$TITLE" =~ (\ to\ v[0-9]+|\ \(major\))(\ -\ autoclosed)?$ ]] \
              || [[ "$BRANCH" == renovate/major-* ]]; then
              review=true
            fi
          fi
          echo "review=$review" >> "$GITHUB_OUTPUT"
          if [ "$review" = false ]; then
            echo "Not reviewed: a Renovate update that is not a major. CI gates it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.scope.outputs.review == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude review
        if: steps.scope.outputs.review == 'true'
        env:
          # The review command hands its checks and reviewers to subagents. Run
          # through the SDK, Claude started them in the background, ended its
          # turn to wait for their notices, and the run finished before any
          # report arrived: no review and no comment. With background tasks off,
          # Claude waits for each subagent before it continues
          # (https://code.claude.com/docs/en/subagents, "Let Claude wait for a
          # subagent").
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Renovate's pull requests are reviewed like anyone else's. Without
          # this the action refuses them — "Workflow initiated by non-human
          # actor" — and every dependency update carries a permanently red
          # check, which trains people to ignore red.
          #
          # An EXPLICIT list, never '*'. These repositories are public, and the
          # action's own security guidance is direct about what that combination
          # costs: "Allowed bots are not checked for repository permissions. A
          # bot that matches an entry does not need to be installed on your
          # repository or have write access... any such App can invoke this
          # action with a prompt it controls." With `renovate` named, only the
          # Mend app we installed qualifies.
          allowed_bots: 'renovate'
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          # The PR is passed as its URL. `owner/repo/pull/N` is not a PR selector
          # gh understands: `gh pr view` reads it as a branch name and answers
          # "no pull requests found", so the plugin's first check failed and the
          # run stopped before reviewing, unless the model happened to rewrite
          # the argument.
          prompt: '/code-review:code-review ${{ github.event.pull_request.html_url }} --comment'
          # The final review text goes to the job's step summary, so a run that
          # ends early shows why. Tool output stays hidden.
          display_report: true
          # Tool output stays out of the public log, except on a run re-run with
          # debug logging (`gh run rerun <id> --debug`): then every tool call and
          # its result is printed, so a denied command can be seen.
          show_full_output: ${{ runner.debug == '1' }}
          # Reviewer charter: steers the review toward high-signal, whole-codebase
          # consistency checks while suppressing nitpicks and review loops. The
          # per-repo CLAUDE.md "Review criteria" section supplies the domain rules.
          claude_args: >-
            --append-system-prompt "You are a senior reviewer. Optimize for signal, not volume. Report a finding only when you are confident it is real and materially affects correctness, security, data integrity, a public contract, or an explicit rule in the nearest CLAUDE.md Review criteria section; when unsure, stay silent. Never flag style, formatting, naming taste, or anything a linter, formatter, or type-checker already enforces; no nit-grade or consider-grade comments. You may read the wider codebase to judge a finding, but only report issues introduced or triggered by this diff; never comment on pre-existing problems on unchanged lines. Before flagging an inconsistency, grep for the established pattern and cite the file and line you compared against. One comment per unique issue; no duplicates; post a committable suggestion only when it fully fixes the issue. Idempotency: do not re-raise a point already made on this PR, and do not reopen resolved or outdated threads; never contradict your earlier review; if your assessment changed, say so once and move on. Skip generated or vendored paths and any line carrying an ai-review-ignore marker. Respect the PR stated intent; do not demand changes that conflict with its goal."
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
