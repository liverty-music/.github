name: Reusable Claude Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude review
        id: claude
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          claude_args: '--allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"'

      - name: Count unresolved Claude review threads
        id: count
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail
          query='query($owner: String!, $repo: String!, $number: Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $number) {
                reviewThreads(first: 100) {
                  pageInfo { hasNextPage }
                  nodes {
                    isResolved
                    isOutdated
                    comments(first: 1) {
                      nodes { author { __typename login } }
                    }
                  }
                }
              }
            }
          }'
          if ! result=$(gh api graphql -f query="$query" -F owner="$REPO_OWNER" -F repo="$REPO_NAME" -F number="$PR_NUMBER" 2>/dev/null); then
            echo "count=-1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(echo "$result" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')" = "true" ]; then
            echo "count=-1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! n=$(echo "$result" | jq '[
              .data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false
                       and .isOutdated == false
                       and .comments.nodes[0].author.__typename == "Bot"
                       and .comments.nodes[0].author.login == "claude")
            ] | length' 2>/dev/null); then
            echo "count=-1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Publish Claude review Check Run
        if: always()
        uses: actions/github-script@v7
        env:
          COUNT: ${{ steps.count.outputs.count }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const count = parseInt(process.env.COUNT, 10);
            const prNumber = process.env.PR_NUMBER;
            let conclusion, title;
            if (Number.isNaN(count) || count < 0) {
              conclusion = 'neutral';
              title = 'Verdict could not be computed';
            } else if (count === 0) {
              conclusion = 'success';
              title = 'No issues found';
            } else {
              conclusion = 'failure';
              title = `${count} issue(s) found`;
            }
            const filesUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}/files`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Claude review',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion,
              output: {
                title,
                summary: `See PR inline comments for findings: [Files changed](${filesUrl})`,
              },
            });
