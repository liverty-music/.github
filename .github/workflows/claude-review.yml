name: Reusable Claude Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  # The plan step reads this workflow's earlier runs to find the last
  # reviewed commit.
  actions: read

jobs:
  review:
    # A review of a commit that a newer push superseded is wasted runner time,
    # and the callers had no concurrency group, so every push ran a full review
    # to the end (cloud-provisioning#666). The group lives here so all four
    # callers get it; `github` is the caller's context in a reusable workflow.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Draft pull requests are reviewed once they are marked ready: every caller
    # triggers on `ready_for_review`.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      # A review costs a share of the CLAUDE_CODE_OAUTH_TOKEN account's weekly
      # limit, which ran out on 2026-11-07 and failed every repository's review
      # ("You've hit your weekly limit"). Renovate's non-major updates were 152
      # of the 352 successful reviews from 2026-11-01 to 11-08 but only 9 % of
      # their run time (197 of 2,164 minutes, about 1.3 minutes each); reviews
      # of pull requests opened by people took 88 %. Skipping these saves little,
      # but nothing is lost: a minor, patch, digest, pin or lock update is gated
      # by CI and mostly automerges, while a major changes an API and is merged
      # by a person, so only majors are reviewed.
      #
      # A major is recognised by Renovate's default title: `commitMessageExtra`
      # writes the bare major (`to v7`) for a major and the full version
      # (`to v7.0.2`) otherwise, and a group of majors ends in `(major)`. A
      # `renovate/major-*` branch counts too. Checked against the 231 Renovate
      # pull requests in the organization up to 2026-11-08: all 43 majors match
      # and nothing else does. A label would be sturdier, but Renovate adds it
      # after opening the pull request, so the `opened` event carries none.
      - name: Decide whether to review
        id: scope
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          review=true
          if [ "$AUTHOR" = "renovate[bot]" ]; then
            review=false
            if [[ "$TITLE" =~ (\ to\ v[0-9]+|\ \(major\))(\ -\ autoclosed)?$ ]] \
              || [[ "$BRANCH" == renovate/major-* ]]; then
              review=true
            fi
          fi
          echo "review=$review" >> "$GITHUB_OUTPUT"
          if [ "$review" = false ]; then
            echo "Not reviewed: a Renovate update that is not a major. CI gates it." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.scope.outputs.review == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # The review instructions live beside this workflow (review/*.md), so
      # one edit reaches every repository, as the workflow does.
      - name: Checkout review instructions
        if: steps.scope.outputs.review == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: liverty-music/.github
          ref: main
          path: .review-kit/kit
          sparse-checkout: review
          fetch-depth: 1

      # Decides what this run reviews and writes it to .review-kit/run/ for the
      # instructions to read. Half of the review time went to re-reviews, each
      # of the whole pull request (median 11.8 minutes, 2026-10-29 to 11-08):
      # the plugin meant to stop once Claude had commented, but looked only at
      # conversation comments, never at its own inline ones.
      #
      # - Scope: after a push, only the commits since the last successful
      #   review of this pull request, when that commit is an ancestor of the
      #   head (a rebase makes it not, and the whole pull request is reviewed).
      #   CodeRabbit and Anthropic's managed Code Review re-review the same way.
      #   Listing the runs needs `actions: read`, which each caller grants.
      # - Kind: a pull request that changes only Markdown (and OpenSpec's
      #   `.openspec.yaml` metadata) gets the document review (review/docs.md);
      #   bug agents had nothing to find in OpenSpec plans and archives, which
      #   took 37 % of the review time.
      # - Earlier findings: Claude's inline and conversation comments, so a
      #   later review does not repeat them.
      #
      # Any lookup that fails falls back to a full review: never less than
      # before.
      - name: Plan the review
        id: plan
        if: steps.scope.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTION: ${{ github.event.action }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -u
          run_dir=.review-kit/run
          mkdir -p "$run_dir"

          kind=code
          if files=$(gh pr diff "$PR" --repo "$REPO" --name-only) && [ -n "$files" ] \
            && ! grep -qvE '\.md$|(^|/)\.openspec\.yaml$' <<<"$files"; then
            kind=docs
          fi

          scope=full
          range=""
          if [ "$ACTION" = synchronize ]; then
            # The caller's workflow file: owner/repo/.github/workflows/<file>@ref.
            workflow=${WORKFLOW_REF%@*}
            workflow=${workflow##*/}
            last=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?branch=$BRANCH&event=pull_request&status=success&per_page=30" \
              --jq "[.workflow_runs[] | select(.head_sha != \"$HEAD_SHA\")][0].head_sha // empty" 2>/dev/null || true)
            if [ -n "$last" ]; then
              status=$(gh api "repos/$REPO/compare/$last...$HEAD_SHA" --jq .status 2>/dev/null || true)
              case "$status" in
                ahead)
                  if gh api "repos/$REPO/compare/$last...$HEAD_SHA" \
                      -H "Accept: application/vnd.github.diff" > "$run_dir/increment.diff" 2>/dev/null \
                    && [ -s "$run_dir/increment.diff" ]; then
                    scope=increment
                    range="$last..$HEAD_SHA"
                  fi ;;
              esac
            fi
          fi

          {
            gh api --paginate "repos/$REPO/pulls/$PR/comments" \
              --jq '.[] | select(.user.login == "claude[bot]") | "- \(.path):\(.line // .original_line) — \(.body | split("\n")[0])"' 2>/dev/null || true
            gh api --paginate "repos/$REPO/issues/$PR/comments" \
              --jq '.[] | select(.user.login == "claude[bot]") | "- (summary) \(.body | gsub("\n"; " ") | .[0:300])"' 2>/dev/null || true
          } > "$run_dir/previous-findings.md"

          {
            echo "# This review run"
            echo
            echo "- Pull request: $PR_URL"
            echo "- Head commit: $HEAD_SHA"
            echo "- Scope: $scope"
            if [ "$scope" = increment ]; then
              echo "- Commits in scope: $range"
              echo "- Increment diff: $run_dir/increment.diff"
            fi
            echo "- Previous findings: $run_dir/previous-findings.md ($(wc -l < "$run_dir/previous-findings.md") lines)"
          } > "$run_dir/context.md"

          echo "review=true" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Review: $kind, $scope${range:+ ($range)}." >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude review
        if: steps.scope.outputs.review == 'true' && steps.plan.outputs.review == 'true'
        env:
          # The review command hands its checks and reviewers to subagents. Run
          # through the SDK, Claude started them in the background, ended its
          # turn to wait for their notices, and the run finished before any
          # report arrived: no review and no comment. With background tasks off,
          # Claude waits for each subagent before it continues
          # (https://code.claude.com/docs/en/subagents, "Let Claude wait for a
          # subagent").
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Renovate's pull requests are reviewed like anyone else's. Without
          # this the action refuses them — "Workflow initiated by non-human
          # actor" — and every dependency update carries a permanently red
          # check, which trains people to ignore red.
          #
          # An EXPLICIT list, never '*'. These repositories are public, and the
          # action's own security guidance is direct about what that combination
          # costs: "Allowed bots are not checked for repository permissions. A
          # bot that matches an entry does not need to be installed on your
          # repository or have write access... any such App can invoke this
          # action with a prompt it controls." With `renovate` named, only the
          # Mend app we installed qualifies.
          allowed_bots: 'renovate'
          # The instructions are the code-review plugin's, adapted to take a
          # scope (review/code.md, with its attribution), or the document review
          # (review/docs.md). The plan step's context file says which.
          prompt: 'Read .review-kit/kit/review/${{ steps.plan.outputs.kind }}.md and follow it. The context file it names is .review-kit/run/context.md.'
          # The final review text goes to the job's step summary, so a run that
          # ends early shows why. Tool output stays hidden.
          display_report: true
          # Tool output stays out of the public log, except on a run re-run with
          # debug logging (`gh run rerun <id> --debug`): then every tool call and
          # its result is printed, so a denied command can be seen.
          show_full_output: ${{ runner.debug == '1' }}
          # Reviewer charter: steers the review toward high-signal, whole-codebase
          # consistency checks while suppressing nitpicks and review loops. The
          # per-repo CLAUDE.md "Review criteria" section supplies the domain rules.
          claude_args: >-
            --append-system-prompt "You are a senior reviewer. Optimize for signal, not volume. Report a finding only when you are confident it is real and materially affects correctness, security, data integrity, a public contract, or an explicit rule in the nearest CLAUDE.md Review criteria section; when unsure, stay silent. Never flag style, formatting, naming taste, or anything a linter, formatter, or type-checker already enforces; no nit-grade or consider-grade comments. You may read the wider codebase to judge a finding, but only report issues introduced or triggered by this diff; never comment on pre-existing problems on unchanged lines. Before flagging an inconsistency, grep for the established pattern and cite the file and line you compared against. One comment per unique issue; no duplicates; post a committable suggestion only when it fully fixes the issue. Idempotency: do not re-raise a point already made on this PR, and do not reopen resolved or outdated threads; never contradict your earlier review; if your assessment changed, say so once and move on. Skip generated or vendored paths and any line carrying an ai-review-ignore marker. Respect the PR stated intent; do not demand changes that conflict with its goal."
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
