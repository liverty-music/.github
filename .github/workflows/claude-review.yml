name: Reusable Claude Review

on:
  workflow_call:
    inputs:
      verdict_only:
        description: 'When true, skip the Claude review run and only recompute the verdict Check Run. Used by callers triggered on pull_request_review_thread events.'
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: ${{ inputs.verdict_only == false }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude review
        id: claude
        if: ${{ inputs.verdict_only == false }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          claude_args: '--allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"'

      - name: Count unresolved Claude inline comments on head SHA
        id: count
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail

          query='query($owner: String!, $repo: String!, $number: Int!, $after: String) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $number) {
                reviewThreads(first: 100, after: $after) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isResolved
                    comments(first: 100) {
                      nodes {
                        commit { oid }
                        author { login __typename }
                      }
                    }
                  }
                }
              }
            }
          }'

          total=0
          after=""
          while :; do
            if [ -z "$after" ]; then
              resp=$(gh api graphql -f query="$query" -F owner="$REPO_OWNER" -F repo="$REPO_NAME" -F number="$PR_NUMBER" 2>/dev/null) || {
                echo "count=-1" >> "$GITHUB_OUTPUT"
                exit 0
              }
            else
              resp=$(gh api graphql -f query="$query" -F owner="$REPO_OWNER" -F repo="$REPO_NAME" -F number="$PR_NUMBER" -f after="$after" 2>/dev/null) || {
                echo "count=-1" >> "$GITHUB_OUTPUT"
                exit 0
              }
            fi

            if echo "$resp" | jq -e '.errors' >/dev/null 2>&1; then
              echo "count=-1" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            page_count=$(echo "$resp" | jq --arg sha "$HEAD_SHA" '
              [.data.repository.pullRequest.reviewThreads.nodes[]
                | select(.isResolved == false)
                | .comments.nodes[]
                | select(.commit.oid == $sha)
                | select(.author.login == "claude" and .author.__typename == "Bot")
              ] | length' 2>/dev/null) || {
              echo "count=-1" >> "$GITHUB_OUTPUT"
              exit 0
            }
            total=$((total + page_count))

            has_next=$(echo "$resp" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')
            if [ "$has_next" != "true" ]; then
              break
            fi
            after=$(echo "$resp" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor')
          done

          echo "count=$total" >> "$GITHUB_OUTPUT"

      - name: Publish Claude review Check Run
        if: always()
        uses: actions/github-script@v7
        env:
          COUNT: ${{ steps.count.outputs.count }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const count = parseInt(process.env.COUNT, 10);
            const prNumber = process.env.PR_NUMBER;
            let conclusion, title;
            if (Number.isNaN(count) || count < 0) {
              conclusion = 'neutral';
              title = 'Verdict could not be computed';
            } else if (count === 0) {
              conclusion = 'success';
              title = 'No issues found';
            } else {
              conclusion = 'failure';
              title = `${count} issue(s) found`;
            }
            const filesUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}/files`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Claude review',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion,
              output: {
                title,
                summary: `See PR inline comments for findings: [Files changed](${filesUrl})`,
              },
            });
